name: Deploy to Cloudflare Workers

# Automation approval: approved-restored 2026-05-30 by Travis J. Neuman.
# Purpose: deploy Neuman Learn to Cloudflare Workers after master updates.
# Quota impact: GitHub Actions minutes and Cloudflare Workers deploy quota on pushes to master.
# Writes/deploys: deploys Cloudflare only; does not commit repository changes.
# Registry: E:/Web Development/_meta.notes/Projects/.webdev/Automation Approval Registry - 2026-05-30.md
# Do not disable or mutate without workflow review, _meta.notes documentation, and current-session approval.

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
